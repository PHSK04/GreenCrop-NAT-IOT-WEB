services:
  postgres:
    image: postgres:16-alpine
    container_name: greencrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: SmartIoTDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SmartIoTDB"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: greencrop-backend
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      PORT: 3001
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: SmartIoTDB
      DB_SSL_MODE: disable
      # Reuse the Ollama desktop service already running on the host.
      NAT_AI_OLLAMA_URL: http://host.docker.internal:11434
      NAT_AI_OLLAMA_MODEL: qwen2.5:7b
      NAT_AI_TTS_HTTP_URL: http://host.docker.internal:3012
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: greencrop-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama-model:
    image: ollama/ollama:latest
    container_name: greencrop-ollama-model
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama show qwen2.5:7b >/dev/null 2>&1 || ollama pull qwen2.5:7b"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
